name: Build MinOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: ./scripts/validate.sh

  build-x86_64:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build x86_64 ISO
        run: |
          docker run --rm --privileged \
            -v "$PWD:/src" -w /src archlinux:latest \
            bash -lc 'pacman -Syu --noconfirm archiso grub && ./scripts/build.sh x86_64'
      - uses: actions/upload-artifact@v4
        with:
          name: MinOS-x86_64
          path: |
            out/MinOS-x86_64.iso
            out/MinOS-x86_64.iso.sha256
          if-no-files-found: error

  build-i686:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: 386
      - name: Create Arch Linux 32 build container
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools squashfs-tools
          iso_name=archlinux32-2024.07.10-i686.iso
          mirrors=(
            https://mirror.math.princeton.edu/pub/archlinux32/archisos
            https://mirror.clarkson.edu/archlinux32/archisos
            https://mirror.yandex.ru/archlinux32/archisos
            https://mirror.archlinux32.org/archisos
          )
          for mirror in "${mirrors[@]}"; do
            if curl -fL --connect-timeout 15 --retry 2 \
              "$mirror/$iso_name" -o /tmp/archlinux32.iso; then
              break
            fi
            rm -f /tmp/archlinux32.iso
          done
          test -s /tmp/archlinux32.iso
          mkdir -p /tmp/archlinux32-iso /tmp/archlinux32-root
          bsdtar -xf /tmp/archlinux32.iso -C /tmp/archlinux32-iso
          rootfs="$(find /tmp/archlinux32-iso -type f -name 'airootfs.sfs' -print -quit)"
          test -n "$rootfs"
          sudo unsquashfs -d /tmp/archlinux32-root "$rootfs"
          sudo tar --numeric-owner -C /tmp/archlinux32-root -cf - . | \
            docker import --platform linux/386 - minos-archlinux32:latest
      - name: Build i686 ISO
        run: |
          docker run --rm --privileged --platform linux/386 \
            -v "$PWD:/src" -w /src minos-archlinux32:latest \
            bash -lc 'pacman-key --init && pacman-key --populate archlinux32 && pacman -Syu --noconfirm archiso && ./scripts/build.sh i686'
      - uses: actions/upload-artifact@v4
        with:
          name: MinOS-i686
          path: |
            out/MinOS-i686.iso
            out/MinOS-i686.iso.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-x86_64, build-i686]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MinOS-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
